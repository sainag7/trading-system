# =============================================================================
# Swing-Trading System Configuration
# =============================================================================
# Strategy: multi-week to multi-month swing trades, concentrated 5-15 name
# portfolio of US equities, evaluated once per day (no intraday / HFT).
#
# Everything in this file is user-editable. The values under `risk:` are HARD
# limits enforced deterministically in risk/guardrails.py (no LLM involved).
# If you loosen them, you are accepting more risk. Read README.md first.
# =============================================================================

# ----------------------------------------------------------------------------
# Run mode. CLI flag --mode overrides this value.
#   recommend : research + advice ONLY; trades nothing (DEFAULT)
#   explain   : deep-research briefing for ONE ticker (--ticker required);
#               read-only, trades nothing
#   preview   : print/notify planned orders, require explicit confirmation
#   live      : place real orders through the Robinhood Trading MCP
#   review    : post-close learning pass (see `review:` below); read-only
# ----------------------------------------------------------------------------
mode: recommend

# ----------------------------------------------------------------------------
# GLOBAL KILL SWITCH
# If true (or if the file at kill_switch_file exists), the orchestrator halts
# ALL trading before any order is placed, in every mode. Flip this to stop the
# system instantly without editing code.
# ----------------------------------------------------------------------------
kill_switch: false
kill_switch_file: "KILL_SWITCH"   # presence of this file == kill switch ON

# ----------------------------------------------------------------------------
# HARD RISK LIMITS  (enforced by risk/guardrails.py — never bypassed)
# ----------------------------------------------------------------------------
risk:
  max_positions: 15                  # max number of concurrent open positions
  max_position_pct: 0.15             # no single name > 15% of account equity
  max_sector_pct: 0.40               # no single sector > 40% of account equity
  per_trade_max_usd: 500             # max notional $ per individual order
  daily_max_trades: 5                # max executed orders per calendar day
  min_cash_reserve_pct: 0.10         # always keep >= 10% of equity in cash
  max_account_drawdown_halt_pct: 0.15  # halt if account down >15% from peak
  min_trade_usd: 50                  # don't bother with orders smaller than this
  allow_fractional_shares: true      # Robinhood supports fractional equity
  no_trade_list: []                  # tickers to NEVER touch (buys blocked)
  # Scale approved BUYs up so they consume the deployable cash instead of leaving
  # an unspent remainder. OFF by default: on a book with a real cash reserve,
  # partial deployment is a legitimate outcome. Enabled per-account below.
  sweep_cash_to_buys: false

# ----------------------------------------------------------------------------
# Strategy / scoring parameters (used by the analysis & decision agents)
#
# ONE strategy, no profiles. The holding horizon is set primarily by execution
# friction: at the 0.5%-per-side limit slippage configured below, a 10-day
# time-stop implies ~25 round trips a year and ~25%/yr of pure slippage drag —
# more than three times a realistic edge. A ~60-day ceiling cuts that to ~4%/yr.
#
# Horizon and the fundamental weight in `analysis:` are COUPLED. A 10-day hold
# can ignore fundamentals (nothing about a business changes in 10 days); a
# 60-day hold cannot. Do not shorten one without revisiting the other.
# ----------------------------------------------------------------------------
strategy:
  holding_period_days_min: 10        # horizon: ~2 weeks ...
  holding_period_days_max: 60        # ... to ~3 months
  target_portfolio_size: 5           # aim (per-account max_positions may cap lower)
  min_score_to_buy: 65               # 0-100 composite score required to open
  min_score_to_add: 70               # higher bar to add to a winner
  trim_below_score: 48               # consider trimming when score decays
  exit_below_score: 38               # thesis-break exit threshold
  # Default per-position exit rules (decision agent may tighten, never loosen).
  # The screener surfaces names averaging ~44% annualised volatility, so a tight
  # stop fires on noise rather than on a broken thesis. 12% over a 60-day hold is
  # still inside one sigma for the more volatile names — the volatility ceiling
  # in `discovery:` is what keeps the worst offenders out of the universe.
  default_stop_loss_pct: 0.12        # legacy/fallback stop (used only when ATR is unavailable)
  default_take_profit_pct: 0.20      # legacy/fallback target (monitor fallback only)
  max_holding_days: 60               # time-based exit if thesis hasn't played out
  # The smallest position worth HOLDING is a per-account RISK setting
  # (`accounts.<role>.risk.min_position_usd` / `min_position_pct`), not a
  # strategy knob: it scales with the book. It bounds opens after the cash
  # sweep, and a graded (half) exit whose remainder would fall under it closes
  # the whole position instead.
  #
  # No rebuy of a name this account sold in the last N calendar days (0 = off).
  # The same-cycle sell-and-rebuy is filtered separately; this covers the
  # next-day version — NVDA was sold and rebought on 8/27→8/28, 8/31 and 9/03,
  # paying a market-order round trip of spread each time for no change in view.
  # A banked take-profit partial is not an exit of the idea and starts no cooldown.
  rebuy_cooldown_days: 3

  # -- Methodology: momentum + quality factor model with volatility-based risk --
  # Master switch. "momentum_quality" (default) uses the factor scoring + ATR
  # trailing stops below; "legacy" reverts to the old technical/fundamental/
  # sentiment blend + the fixed-% stops above. Evidence-based edge: ride uptrends
  # in quality names, cut/avoid downtrends. No system predicts prices — the edge
  # is factor exposure + disciplined risk, and it is probabilistic.
  methodology: momentum_quality
  # Volatility-based exits (replace the flat percentages above in this mode):
  stop_atr_mult: 2.5                 # entry stop = price − 2.5·ATR ...
  max_loss_pct: 0.10                 # ... but NEVER risk more than 10% (hard loss cap;
                                     #     this is what stops a −42% NBIS-style hold)
  target_r_multiple: 2.5             # target = 2.5× the risk (fixed reward:risk)
  use_trailing_stop: true            # chandelier: raise the stop to peak − trail_atr_mult·ATR
  trail_atr_mult: 3.0                #   each day (never lowered) so winners' stops ratchet up
  graded_stops: true                 # a quality uptrend pulling back to its stop scales out to
                                     #   half (not a full dump); a broken downtrend exits fully
  vol_target_sizing: true            # shrink high-ATR names so dollar risk is roughly constant

# ----------------------------------------------------------------------------
# Analysis scoring. The analysis agent blends three deterministic 0-100
# sub-scores into a composite. Weights are renormalised automatically if they
# don't sum to 1.0.
#
# Tilted technical because the discovery screener surfaces names on momentum and
# technicals are what time the entry — but fundamentals are held at 20% rather
# than token weight, because positions are held up to 60 days. Measured against
# real run data, this weighting clears more candidates than either a 40/35/25 or
# a 65/10/25 split, and it keeps fundamentally weak names (weak margins, heavy
# leverage) from ranking on technicals alone.
# ----------------------------------------------------------------------------
analysis:
  # Legacy blend (methodology: legacy only).
  weights:
    technical: 0.55        # trend / momentum / volatility / location
    fundamental: 0.20      # growth / profitability / valuation / balance sheet
    sentiment: 0.25        # aggregate news sentiment
  # Factor model (methodology: momentum_quality, the default). Evidence-based
  # factors — momentum + quality tilted (the best-supported long-run drivers) —
  # each z-scored across the run's universe for a cross-sectional tilt on top of
  # the absolute score. Retune to change the strategy's character.
  factor_weights:
    momentum: 0.30         # 12-1 return, trend, proximity to highs
    quality: 0.25          # margins, free cash flow, low leverage
    value: 0.15            # forward P/E, P/S, upside to analyst target
    growth: 0.15           # revenue / EPS growth
    sentiment: 0.15        # news + analyst recommendation

# ----------------------------------------------------------------------------
# Universe / watchlist — INTENTIONALLY EMPTY.
#
# There is no fixed watchlist. Every ticker researched in a run comes from the
# `discovery:` market scan below, so the agents always look at what the market
# is actually doing rather than at a list someone typed months ago. A static
# universe of large caps used to dominate the composite ranking every run and
# crowd out the names the screener surfaced.
#
# NOTE: the pipeline no longer reads this key — adding tickers here has NO
# effect. The key is kept only so the dashboard and config API keep working.
# To change what gets researched, tune `discovery:` below.
# ----------------------------------------------------------------------------
universe: []

# Optional sector map. Purely a hint — it is NOT a watchlist and does not cause
# these tickers to be researched (the screener may still surface them). If a
# ticker isn't listed here the data provider fills the sector in from
# fundamentals; this map guarantees correct sector grouping for the
# max_sector_pct guardrail even when the API is unavailable.
sectors:
  AAPL: Technology
  MSFT: Technology
  NVDA: Technology
  GOOGL: Communication Services
  AMZN: Consumer Discretionary
  META: Communication Services
  JPM: Financials
  V: Financials
  UNH: Health Care
  XOM: Energy
  CAT: Industrials
  COST: Consumer Staples

# ----------------------------------------------------------------------------
# Dynamic discovery (screener). This is now the ONLY source of tickers: each
# run scans FREE sources (yfinance screeners, Yahoo trending, Reddit) for
# trending/most-active names, pre-filters them with yfinance only (NO Alpha
# Vantage quota cost), and researches the strongest by 1-month momentum.
#
# FAIL-CLOSED: if discovery fails or finds nothing there is no watchlist to
# fall back to — the run halts and trades nothing. Setting dynamic_discovery
# to false therefore disables trading entirely; it does not revert to a
# static universe.
# ----------------------------------------------------------------------------
discovery:
  dynamic_discovery: true     # master on/off toggle (false == trade nothing)
  max_discovered: 20          # tickers researched per run
  min_avg_volume: 500000      # pre-filter: require > this avg daily volume
  min_price: 2                # pre-filter: price band (avoid penny stocks ...)
  max_price: 500              #             ... and very high-priced names
  # Volatility ceiling (annualised, from 3 months of daily returns). On a
  # concentrated 3-name book a name at 87% annualised vol cannot be risk-managed
  # by any stop setting — the stop sits far inside normal daily drift, so it
  # exits on noise and pays the round-trip slippage each time. Screen them out
  # rather than trying to size around them.
  max_annualized_vol: 0.60
  use_yfinance_screeners: true   # yfinance most_actives / day_gainers
  use_yahoo_trending: true       # Yahoo Finance trending endpoint
  use_reddit: true               # r/wallstreetbets + r/stocks hot.json mentions

# ----------------------------------------------------------------------------
# LLM model selection for each agent.
# Cheaper/faster models for high-volume gathering, stronger model for the
# final capital-allocation decision.
# ----------------------------------------------------------------------------
# Fast preset: Haiku for the high-volume / supporting agents, Sonnet for the
# final capital-allocation decision (one call per cycle; the Robinhood MCP is
# called directly with no model — see data/robinhood_mcp.py). Opus
# (claude-opus-5 / claude-opus-4-8) is far more expensive here for little
# gain, since the decision is bounded by the deterministic guardrails.
models:
  research_agent: "claude-haiku-4-5-20251001"
  analysis_agent: "claude-haiku-4-5-20251001"
  decision_agent: "claude-sonnet-4-6"
  monitor_agent: "claude-haiku-4-5-20251001"
  # Deep-research briefings (--mode explain): one read-heavy call per run.
  explain_agent: "claude-sonnet-4-6"
  # Post-close review (--mode review): one call per trading day that turns the
  # deterministic scorecard into lessons, a playbook and parameter proposals.
  review_agent: "claude-sonnet-4-6"

# ----------------------------------------------------------------------------
# Research performance. The per-ticker numbers (technicals/fundamentals/news
# sentiment) are computed deterministically; the per-ticker LLM enrichment only
# adds free-text notes. Leaving it OFF removes one LLM call per ticker (the main
# speedup) — news still drives recommendations via the deterministic sentiment
# score and the analysis step. Tickers are researched concurrently.
# ----------------------------------------------------------------------------
research:
  llm_enrichment: false       # per-ticker LLM notes (off = much faster)
  concurrency: 5              # how many tickers to research in parallel

# ----------------------------------------------------------------------------
# Data providers & caching (protects the Alpha Vantage 25 req/day free tier)
# ----------------------------------------------------------------------------
data:
  cache_dir: ".cache"
  cache_ttl_minutes: 1440            # reuse cached data for 24h (daily cadence)
  # Use the Robinhood Trading MCP for market data (real-time quotes +
  # fundamentals) instead of Alpha Vantage — quota-free, so the 25/day AV cap
  # stops biting. Called DIRECTLY (no model): run `python -m data.robinhood_mcp
  # login` once to store the OAuth session in .cache/. Daily SERIES comes from
  # yfinance (see use_alphavantage_series below), and Alpha Vantage is then used
  # ONLY for news sentiment (Robinhood has no news tool); FRED still supplies
  # macro. Falls back to yfinance on any Robinhood miss. Turn off to use the
  # pure Alpha-Vantage/yfinance path.
  use_robinhood_data: true
  # Alpha Vantage no longer serves daily series on the free tier
  # (TIME_SERIES_DAILY outputsize=full is premium; compact is only 100 bars <
  # the 200-day SMA lookback). Keep OFF: series is served free by yfinance and AV
  # is reserved for news. Only set true if you hold a premium Alpha Vantage key.
  use_alphavantage_series: false
  alphavantage:
    daily_request_budget: 25         # free-tier hard cap; provider self-throttles
    # Alpha Vantage's stated free-tier pace is 1 request per second; 13s dated
    # from the old 5-calls/minute tier. Calls are serialised across the research
    # threads at this spacing, so 20 tickers cost ~40s on the first run of the
    # day (the second run reads the 24h cache).
    min_seconds_between_calls: 2
  use_yfinance_fallback: true        # yfinance serves quotes/series when needed (free)
  use_fred: true                     # macro context (rates, etc.) when configured

# ----------------------------------------------------------------------------
# Execution (Robinhood Trading MCP, called directly). OAuth session lives in
# .cache/robinhood_oauth.json (gitignored); no API key/secret in this repo.
# ----------------------------------------------------------------------------
execution:
  mcp_url: "https://agent.robinhood.com/mcp/trading"
  order_type: "limit"                # limit | market  (limit recommended)
  limit_slippage_pct: 0.005          # place limit 0.5% above ask (buy) / below bid (sell)
  max_order_retries: 2               # retries for *submission* errors only, never blind re-fills
  retry_backoff_seconds: 5
  # place_equity_order returns on ACCEPTANCE, not execution — so a successful
  # send reports "submitted" with no price and the real fill lands moments later.
  # Without reading it back the system books the pre-trade reference price as the
  # cost basis and anchors the stop to it. Read-only; never resubmits. 0 disables.
  fill_poll_attempts: 5
  fill_poll_interval_seconds: 2
  # Read your REAL Robinhood holdings (READ-ONLY) in recommend/explain modes, so
  # advice + verdicts are position-aware (hold/trim/sell/add for names you own).
  # Requires the stored Robinhood OAuth session (see data: above). Turn off to
  # always use the hypothetical book.
  # Trading still only happens in preview/live — this flag never places an order.
  read_live_account: true

# ----------------------------------------------------------------------------
# BROKERAGE ACCOUNTS (multi-account routing)
# Robinhood exposes multiple accounts under one login; every per-account MCP
# tool (get_portfolio, get_equity_positions, place_equity_order, …) takes an
# account number. Roles below map a friendly name to an account number and to a
# behaviour:
#   individual : ADVICE ONLY — read read-only for recommend/explain.
#   agentic    : AUTONOMOUS TRADING — the small book the agents actually trade.
# Advice modes (recommend/explain) default to `individual`; trading modes
# (preview/live) default to `agentic`, so autonomous trades never touch the
# individual book. Override per run with `--account {individual,agentic}`.
#
# Put your REAL account numbers in config.local.yaml (gitignored), not here.
# Find them in the Robinhood app (Account → account number) or via get_accounts.
#
# SAFETY (three independent backstops against trading the wrong account):
#   1. Robinhood only permits agent/automated orders on an account flagged
#      agentic_allowed=true; place_equity_order is REJECTED server-side otherwise.
#   2. place_equity_order REQUIRES an explicit account number — orders can never
#      silently fall through to a default account.
#   3. `max_equity_guard`: this system refuses to place ANY order when the target
#      account reads richer than the ceiling — so a misroute to a large account
#      cannot place a trade locally either.
# ----------------------------------------------------------------------------
accounts:
  individual:
    number: "YOUR_INDIVIDUAL_ACCT_NUMBER"   # ~$3k book — advice only (agentic_allowed=false)
  agentic:
    number: "YOUR_AGENTIC_ACCT_NUMBER"      # ~$100 "Agentic" book — autonomous (agentic_allowed=true)
    max_equity_guard: 500                   # refuse to trade if this account reads > $500 (anti-misroute)
    # Per-account risk overrides for the small sandbox book, deep-merged over the
    # base risk: block above FOR AGENTIC RUNS ONLY. The individual account always
    # uses the strict base limits unchanged. These make a $100 book tradable
    # (the base $50 min-trade would otherwise reject every order) while keeping
    # every percentage ceiling explicit.
    risk:
      # Allow small/fractional orders (a floor, not a risk ceiling). $5 rather
      # than $1: below a few dollars the market-order spread is the whole trade.
      # Sells are exempt, so a dust stub can always be closed.
      min_trade_usd: 5
      # The smallest position worth HOLDING: the larger of $10 and 5% of equity.
      # Distinct from min_trade_usd (the smallest ORDER). Enforced AFTER the cash
      # sweep, so a buy the idle cash can lift over the floor is lifted, and only
      # a buy the money genuinely cannot make meaningful is dropped — the cash
      # then waits for a day it can matter. A partial exit whose remainder would
      # fall under this floor is taken in full instead. Before this the book
      # bought $1.76 of GOOGL, proposed $0.45 of AAPL, and trimmed HPE down to a
      # $0.97 stub the broker refused.
      min_position_usd: 10
      min_position_pct: 0.05
      # SIZING IS STILL THE DECISION AGENT'S CALL — within one ceiling.
      # The per-trade percentage cap stays off so the agent's conviction sizing
      # reaches the broker unmodified; every cap now TRIMS to the room left
      # rather than rejecting, so a ceiling no longer throws a good idea away.
      #
      # The per-name cap is back ON PURPOSE. It was "no cap" while caps still
      # rejected outright; with trimming that reason is gone, and the ledger
      # made the case for it: on 2026-09-04 the agent put $140 (54% of the book)
      # into NVDA and that one leg lost -$13.13 — more than the account's entire
      # realized loss across 13 closed trades. At 35% one name can never be
      # more than about a third of the book, and a $260 account still fits
      # three to five real positions.
      #
      # What still bounds this account: `max_position_pct`, `per_trade_max_usd`,
      # `min_position_*`, available buying power, `max_equity_guard` above, and
      # the kill switch. The individual account is untouched and keeps the
      # strict base limits.
      per_trade_max_pct: 1.0    # no per-trade percentage cap
      per_trade_max_usd: 500    # absolute ceiling; only binds once equity > $500
      max_position_pct: 0.35    # one name may take at most ~a third of the book
      min_cash_reserve_pct: 0.0 # no cash floor — the book may run fully invested
      # NO position-count cap: the decision agent decides how many names to hold,
      # based on how many candidates actually clear the buy threshold. A fixed
      # count was worse than useless here — the agent read `max_positions: 3` as
      # portfolio shape and sized every name at equity/3, so a day with only two
      # qualifying candidates left the third "slot" sitting in idle cash.
      max_positions: null       # unlimited — the agent chooses the count
      # Force the approved buys to consume the deployable balance. Without this
      # the agent's own arithmetic decides how much stays in cash, and it has
      # repeatedly left a slot's worth idle. Only ever scales orders UP, never
      # past the caps above, and never when the agent proposed no buys at all
      # (proposing nothing is still how it holds cash).
      sweep_cash_to_buys: true
      # Sector cap disabled for this account ON PURPOSE. Screener-discovered
      # tickers often have no sector from the provider, so they all collapse
      # into one "Unknown" bucket and the 2nd buy gets rejected for a breach
      # that is really just missing metadata. The base risk: block keeps 0.40
      # for the individual (advice-only) account.
      max_sector_pct: 1.0

# ----------------------------------------------------------------------------
# Recommend mode: when no real account is connected, recommendations are sized
# against this hypothetical cash so target $ amounts are meaningful.
# ----------------------------------------------------------------------------
recommend:
  hypothetical_cash: 10000.0

# ----------------------------------------------------------------------------
# Post-close REVIEW AGENT (--mode review). Runs once after the close, reads
# the day's decisions and every closed trade in the ledger, and learns from
# the outcomes. Read-only — it never places an order.
#
# Two halves, same split as the rest of the system:
#   * A DETERMINISTIC scorecard (agents/review_agent.py): FIFO round trips with
#     R-multiples, forward returns on every buy/hold/pass, behaviour metrics
#     (concentration, churn, dust orders, take-profit re-fires) and hit rates by
#     score bucket / setup / exit trigger. Pure Python, unit-tested.
#   * ONE model call that turns the scorecard into lessons (fed into the
#     decision and monitor prompts the next morning), a playbook, and parameter
#     proposals.
#
# Proposals are applied ONLY inside the numeric bounds below, only for the
# whitelisted `strategy:` keys, by at most one `step` per review, and only once
# `min_closed_trades` closed round trips exist — a dozen trades cannot tell
# signal from noise, so until then proposals are recorded and shown in the
# dashboard for a human to apply. `risk:` limits are never touched by this
# agent, whatever it proposes.
# ----------------------------------------------------------------------------
review:
  window_days: 60             # trailing window the scorecard covers
  forward_horizons: [1, 5, 10, 20]   # trading days for the forward-return scorecard
  auto_apply: true            # apply in-bounds proposals automatically (else: record only)
  min_closed_trades: 20       # closed round trips required before any auto-apply
  max_lessons_in_prompt: 8    # active lessons handed to the decision/monitor agents
  tunable:                    # strategy keys the agent may move, with hard bounds
    strategy.stop_atr_mult:     {min: 1.5, max: 4.0, step: 0.5}
    strategy.trail_atr_mult:    {min: 2.0, max: 5.0, step: 0.5}
    strategy.target_r_multiple: {min: 1.5, max: 4.0, step: 0.5}
    strategy.min_score_to_buy:  {min: 60,  max: 80,  step: 5}
    strategy.min_score_to_add:  {min: 65,  max: 85,  step: 5}
    strategy.max_holding_days:  {min: 20,  max: 90,  step: 10}

# ----------------------------------------------------------------------------
# Storage / audit
# ----------------------------------------------------------------------------
storage:
  db_path: "storage/trading.db"

# ----------------------------------------------------------------------------
# Notifications (preview mode confirmations, halts, fills). Optional.
# ----------------------------------------------------------------------------
notifications:
  enabled: false
  channel: "stdout"                  # stdout | (extend with slack/email/etc.)
